name: Chazer Dead Code Cleanup

on:
  workflow_dispatch:

jobs:
  scan-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 تحميل كود المشروع
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة جافا
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: 🚀 تثبيت أداة Chazer
        # نستخدم مدير حزم Rust لتثبيت الأداة من مصدرها الرسمي مباشرة
        run: cargo install chazer

      - name: 🔍 فحص وحذف الكود الميت
        # سيتم تشغيل الأداة من المسار الذي يثبت فيه cargo برامجه
        run: ~/.cargo/bin/chazer . --deep --delete

      - name: 📤 إنشاء طلب سحب (Pull Request) للمراجعة
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: remove dead code via Chazer"
          title: "🧹 مراجعة وحذف الأكواد الميتة (Chazer)"
          body: |
            تم فحص المشروع وحذف الأكواد الميتة بواسطة أداة **Chazer**.
            
            **الخطوة المطلوبة منك:**
            الرجاء مراجعة الملفات التي تم تعديلها في هذا الطلب (من تبويب Files changed). 
            إذا كانت التعديلات صحيحة ولا تؤثر على التطبيق، يمكنك الموافقة عليها (Merge) ليتم اعتماد الحذف النهائي في مشروعك.
          branch: chazer-cleanup-pr
          base: main
