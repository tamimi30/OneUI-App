name: Chazer Dead Code Cleanup

on:
  workflow_dispatch: # لتشغيل الفحص يدوياً بضغطة زر

jobs:
  scan-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 تحميل كود المشروع
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة جافا
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: 🚀 تنزيل وتثبيت أداة Chazer
        # نقوم بتحميل النسخة الجاهزة للينكس حسب تعليمات الأداة
        run: |
          wget https://github.com/dr7ro0t/Chazer/releases/latest/download/chazer-linux-x86_64 -O chazer
          chmod +x chazer
          sudo mv chazer /usr/local/bin/

      - name: 🔍 فحص وحذف الكود الميت
        # تشغيل الأداة على المجلد الحالي مع تفعيل خيار الحذف التلقائي
        # استخدمنا --deep لفحص أعمق، و --delete للحذف الفعلي
        run: chazer . --deep --delete

      - name: 📤 إنشاء طلب سحب (Pull Request) للمراجعة
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: remove dead code via Chazer"
          title: "🧹 مراجعة وحذف الأكواد الميتة (Chazer)"
          body: |
            تم فحص المشروع وحذف الأكواد الميتة بواسطة أداة **Chazer**.
            
            **الخطوة المطلوبة منك:**
            الرجاء مراجعة الملفات التي تم تعديلها في هذا الطلب (من تبويب Files changed). 
            إذا كانت التعديلات صحيحة ولا تؤثر على التطبيق، يمكنك الموافقة عليها (Merge) ليتم اعتماد الحذف النهائي في مشروعك.
          branch: chazer-cleanup-pr
          base: main
