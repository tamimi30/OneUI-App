name: Chazer Dead Code Tools

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Chazer binary
        run: |
          curl -L "https://github.com/chazer-tool/chazer/releases/latest/download/chazer-linux-amd64" -o chazer || { echo "Download failed"; exit 1; }
          chmod +x chazer || true
          ./chazer --version || echo "chazer --version failed"

      - name: Run Chazer Scan
        run: ./chazer scan . --json > report.json

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dead-code-report
          path: report.json

  prune:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Chazer binary
        run: |
          curl -L "https://github.com/chazer-tool/chazer/releases/latest/download/chazer-linux-amd64" -o chazer || { echo "Download failed"; exit 1; }
          chmod +x chazer || true

      - name: Run Chazer Prune
        run: ./chazer prune . --batch

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Chazer: remove dead code"
            git push
          fi
