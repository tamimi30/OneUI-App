name: Chazer Dead Code Tools

on:
  workflow_dispatch:   # تشغيل يدوي فقط عند الضغط على زر Run workflow

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Install Chazer
        run: |
          curl -L https://github.com/chazer-tool/chazer/releases/latest/download/chazer-linux-amd64 -o chazer
          chmod +x chazer

      - name: Run Chazer Scan
        run: ./chazer scan . --json > report.json || (echo "Chazer scan failed" && exit 1)

      - name: Upload Report
        uses: actions/upload-artifact@v7   # النسخة الجديدة
        with:
          name: dead-code-report
          path: report.json

  prune:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Install Chazer
        run: |
          curl -L https://github.com/chazer-tool/chazer/releases/latest/download/chazer-linux-amd64 -o chazer
          chmod +x chazer

      - name: Run Chazer Prune
        run: ./chazer prune . --batch || (echo "Chazer prune failed" && exit 1)

      - name: Commit and Push Changes
        uses: actions/checkout@v7
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Chazer: remove dead code"
          git push
