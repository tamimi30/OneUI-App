name: Chazer Dead Code Cleanup

on:
  # يتيح لك تشغيل الفحص يدوياً بضغطة زر من صفحة Actions في GitHub
  workflow_dispatch: 

jobs:
  scan-and-clean:
    runs-on: ubuntu-latest
    
    # إعطاء الصلاحيات اللازمة للبوت لإنشاء فرع جديد وطلب سحب
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Checkout Android Project
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🛠️ Download and Setup Chazer
        run: |
          echo "Cloning Chazer tool from dr7ro0t/Chazer..."
          git clone https://github.com/dr7ro0t/Chazer.git chazer-tool
          # إذا كانت الأداة تتطلب تثبيت مكتبات معينة (مثل بايثون)، يمكنك إضافتها هنا

      - name: 🔍 Run Chazer to Remove Dead Code
        run: |
          echo "Running Chazer on Java/Android files..."
          # ملاحظة هامة: يجب استبدال هذا الأمر بالأمر الفعلي المخصص لتشغيل أداة Chazer
          # على سبيل المثال، إذا كانت الأداة تعمل ببايثون:
          # python chazer-tool/main.py app/src/main/java
          # أو إذا كانت سكريبت Bash:
          # chmod +x chazer-tool/chazer.sh && ./chazer-tool/chazer.sh app/src/main/java
          
      - name: 🚀 Create Pull Request for Manual Review
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: remove dead java code via Chazer"
          title: "🧹 مراجعة وحذف الأكواد الميتة (Chazer)"
          body: |
            تم فحص المشروع بواسطة أداة **[Chazer](https://github.com/dr7ro0t/Chazer)**.
            
            **الخطوة المطلوبة:**
            يرجى مراجعة الأسطر التي تم حذفها في تبويب **Files changed**.
            إذا كانت التعديلات صحيحة ولا تؤثر على التطبيق، يمكنك الموافقة عليها (Merge) ليتم اعتماد الحذف النهائي.
          branch: chazer-cleanup-pr
          base: main # قم بتغييرها إلى master إذا كان هذا هو اسم الفرع الرئيسي لديك
          labels: |
            cleanup
            dead-code
