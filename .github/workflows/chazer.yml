name: Chazer Dead Code Tools

on:
  workflow_dispatch:

env:
  CHAZER_REPO: "chazer-tool/chazer"   # غيّر إذا الريبو مختلف

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve latest Chazer asset URL
        id: resolve
        run: |
          python3 - <<'PY'
import os, json, urllib.request, sys
repo = os.environ.get("CHAZER_REPO")
api = f"https://api.github.com/repos/{repo}/releases/latest"
req = urllib.request.Request(api, headers={"Accept":"application/vnd.github.v3+json","User-Agent":"github-actions"})
with urllib.request.urlopen(req, timeout=30) as r:
    data = json.load(r)
assets = data.get("assets", [])
candidates = [a for a in assets if ("linux" in a.get("name","").lower() or "amd64" in a.get("name","").lower())]
if not candidates and assets:
    candidates = assets
if not candidates:
    print("::set-output name=url::")
    sys.exit(0)
asset = candidates[0]
print(f"::set-output name=url::{asset.get('browser_download_url')}")
print(f"::set-output name=name::{asset.get('name')}")
PY

      - name: Download Chazer binary
        run: |
          if [ -z "${{ steps.resolve.outputs.url }}" ]; then
            echo "No release asset found for $CHAZER_REPO"
            exit 1
          fi
          echo "Downloading ${{ steps.resolve.outputs.name }}"
          curl -L "${{ steps.resolve.outputs.url }}" -o chazer || { echo "curl failed"; exit 1; }
          chmod +x chazer || true
          echo "Downloaded file info:"
          ls -lh chazer || true
          file chazer || true
          ./chazer --version || echo "chazer --version failed (binary may be incompatible)"

      - name: Verify chazer is executable
        run: |
          if [ ! -x ./chazer ]; then
            echo "Downloaded 'chazer' is not executable or missing. Uploading for inspection and failing."
            mkdir -p artifact
            cp chazer artifact/chazer_download || true
            tar -czf artifact_chazer.tar.gz artifact || true
            echo "artifact_chazer.tar.gz" > artifact_list.txt
            ls -l artifact || true
            exit 1
          fi

      - name: Run Chazer Scan
        run: |
          set -e
          ./chazer scan . --json > report.json

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dead-code-report
          path: report.json

      - name: Upload downloaded binary for inspection if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chazer-download-for-inspection
          path: artifact_chazer.tar.gz

  prune:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and install Chazer
        run: |
          python3 - <<'PY'
import os, json, urllib.request, subprocess
repo = os.environ.get("CHAZER_REPO")
api = f"https://api.github.com/repos/{repo}/releases/latest"
req = urllib.request.Request(api, headers={"Accept":"application/vnd.github.v3+json","User-Agent":"github-actions"})
with urllib.request.urlopen(req, timeout=30) as r:
    data = json.load(r)
assets = data.get("assets", [])
candidates = [a for a in assets if ("linux" in a.get("name","").lower() or "amd64" in a.get("name","").lower())]
if not candidates and assets:
    candidates = assets
if not candidates:
    print("No asset found")
    raise SystemExit(1)
url = candidates[0].get("browser_download_url")
subprocess.check_call(["curl","-L",url,"-o","chazer"])
subprocess.check_call(["chmod","+x","chazer"])
print("Downloaded chazer")
PY

      - name: Run Chazer Prune
        run: |
          set -e
          ./chazer prune . --batch

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Chazer: remove dead code"
            git push
          fi
