name: Chazer Dead Code Tools

on:
  workflow_dispatch:

env:
  CHAZER_REPO: "chazer-tool/chazer"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve latest Chazer asset URL
        id: resolve
        shell: bash
        run: |
          python3 - <<'PY'
import os, sys, json, urllib.request
repo = os.environ.get("CHAZER_REPO")
api = f"https://api.github.com/repos/{repo}/releases/latest"
req = urllib.request.Request(api, headers={"Accept":"application/vnd.github.v3+json","User-Agent":"github-actions"})
with urllib.request.urlopen(req, timeout=30) as r:
    data = json.load(r)
assets = data.get("assets", [])
candidates = [a for a in assets if ("linux" in a.get("name","").lower() or "amd64" in a.get("name","").lower())]
if not candidates and assets:
    candidates = assets
if not candidates:
    # no asset found -> leave outputs empty
    sys.exit(0)
asset = candidates[0]
url = asset.get("browser_download_url","")
name = asset.get("name","chazer")
with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
    out.write(f"url={url}\n")
    out.write(f"name={name}\n")
PY

      - name: Download Chazer binary
        run: |
          if [ -z "${{ steps.resolve.outputs.url }}" ]; then
            echo "No release asset found for $CHAZER_REPO"
            exit 1
          fi
          echo "Downloading ${{ steps.resolve.outputs.name }} from ${{ steps.resolve.outputs.url }}"
          curl -L "${{ steps.resolve.outputs.url }}" -o chazer || { echo "curl failed"; exit 1; }
          chmod +x chazer || true
          echo "Downloaded file info:"
          ls -lh chazer || true
          file chazer || true
          # if file command shows text/html or ASCII text, fail early
          if file chazer | grep -qiE 'html|text'; then
            echo "Downloaded file is not a binary executable (likely an HTML error page). Failing."
            exit 1
          fi
          ./chazer --version || echo "chazer --version failed (binary may be incompatible)"

      - name: Run Chazer Scan
        run: |
          set -e
          ./chazer scan . --json > report.json

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dead-code-report
          path: report.json

  prune:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and download Chazer
        run: |
          python3 - <<'PY'
import os, sys, json, urllib.request, subprocess
repo = os.environ.get("CHAZER_REPO")
api = f"https://api.github.com/repos/{repo}/releases/latest"
req = urllib.request.Request(api, headers={"Accept":"application/vnd.github.v3+json","User-Agent":"github-actions"})
with urllib.request.urlopen(req, timeout=30) as r:
    data = json.load(r)
assets = data.get("assets", [])
candidates = [a for a in assets if ("linux" in a.get("name","").lower() or "amd64" in a.get("name","").lower())]
if not candidates and assets:
    candidates = assets
if not candidates:
    print("No asset found")
    raise SystemExit(1)
url = candidates[0].get("browser_download_url")
subprocess.check_call(["curl","-L",url,"-o","chazer"])
subprocess.check_call(["chmod","+x","chazer"])
print("Downloaded chazer")
PY

      - name: Verify chazer is executable
        run: |
          if [ ! -x ./chazer ]; then
            echo "chazer is not executable or missing"
            exit 1
          fi
          file chazer || true
          ./chazer --version || echo "chazer --version failed (binary may be incompatible)"

      - name: Run Chazer Prune
        run: |
          set -e
          ./chazer prune . --batch

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Chazer: remove dead code"
            git push
          fi
