name: Chazer Dead Code Tools

on:
  workflow_dispatch:   # تشغيل يدوي فقط عند الضغط على زر Run workflow

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Install Chazer
        run: |
          curl -L https://github.com/ChazerTool/releases/latest/download/chazer-linux -o chazer
          chmod +x chazer

      - name: Run Chazer Scan
        run: ./chazer scan . --json > report.json

      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: dead-code-report
          path: report.json

  prune:
    runs-on: ubuntu-latest
    needs: scan   # الحذف لا يعمل إلا بعد الفحص
    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Install Chazer
        run: |
          curl -L https://github.com/ChazerTool/releases/latest/download/chazer-linux -o chazer
          chmod +x chazer

      - name: Run Chazer Prune
        run: ./chazer prune . --batch

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Chazer: remove dead code"
          git push
