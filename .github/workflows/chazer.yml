name: Chazer Dead Code Cleanup

on:
  workflow_dispatch:

jobs:
  scan-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 تحميل كود المشروع
        uses: actions/checkout@v7

      - name: ☕ إعداد بيئة جافا
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ تحميل وبناء أداة Chazer محلياً
        run: |
          git clone https://github.com/dr7ro0t/Chazer.git
          cd Chazer
          cargo build --release

      - name: 🔍 فحص وحذف الكود الميت من تطبيقك فقط
        # قمنا بإضافة استبعاد لمجلد أداة Chazer حتى لا يفحصه بالخطأ
        run: ./Chazer/target/release/chazer . --deep true --delete --exclude "Chazer/**"

      - name: 📤 إنشاء طلب سحب (Pull Request) للمراجعة
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: remove dead code via Chazer"
          title: "🧹 مراجعة وحذف الأكواد الميتة (Chazer)"
          body: |
            تم فحص المشروع وحذف الأكواد الميتة بواسطة أداة **Chazer**.
            
            **الخطوة المطلوبة منك:**
            الرجاء مراجعة الملفات التي تم تعديلها في هذا الطلب (من تبويب Files changed). 
            إذا كانت التعديلات صحيحة ولا تؤثر على التطبيق، يمكنك الموافقة عليها (Merge) ليتم اعتماد الحذف النهائي في مشروعك.
          branch: chazer-cleanup-pr
          base: main
