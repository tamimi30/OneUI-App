plugins {
    id 'com.android.library'
}

android {
    // تحديد مسار الحزمة بدقة لضمان عمل استيرادات الموارد مثل: dev.oneuiproject.oneui.R.drawable
    namespace 'dev.oneuiproject.oneui' 
    
    compileSdk 36 // تم التحديث ليتطابق مع التطبيق

    defaultConfig {
        minSdk 26
        versionCode 1
        versionName "1.2.6"

        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        // تم التحديث إلى Java 21 ليتطابق مع التطبيق
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    // توحيد إصدارات مكتبات الدعم مع تلك الموجودة في تطبيقك
    api "androidx.annotation:annotation:1.10.0"

    // توحيد إصدارات SESL بناءً على ما تستخدمه في تطبيقك لمنع تضارب النسخ
    api "io.github.oneuiproject.sesl:appcompat:1.4.0"
    implementation "io.github.oneuiproject.sesl:material:1.5.0"
    implementation "io.github.oneuiproject.sesl:preference:1.1.0"

    // باقي مكتبات SESL الأساسية التي تعتمد عليها OneUI Design
    implementation "io.github.oneuiproject.sesl:indexscroll:1.1.0" 
    implementation "io.github.oneuiproject.sesl:picker-color:1.1.0"
    implementation "io.github.oneuiproject.sesl:picker-basic:1.2.0"

    implementation "com.google.zxing:core:3.5.4"
}
